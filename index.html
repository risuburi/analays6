<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>バスケットボール動画分析 Web App (安全・強化版)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; height: 100vh; display: flex; flex-direction: column; overflow: hidden; touch-action: none; }
        header { background: #1e293b; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
        header h1 { font-size: 1.1rem; font-weight: 700; color: #f97316; display: flex; align-items: center; gap: 8px; }
        .header-actions { display: flex; gap: 8px; align-items: center; }
        
        .btn { background: #334155; color: #f8fafc; border: none; padding: 7px 12px; border-radius: 6px; font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 6px; user-select: none; }
        .btn:hover { background: #475569; }
        .btn-primary { background: #f97316; color: #fff; }
        .btn-primary:hover { background: #ea580c; }
        .btn-success { background: #10b981; color: #fff; }
        .btn-success:hover { background: #059669; }
        .btn-danger { background: #ef4444; color: #fff; }
        .btn-danger:hover { background: #dc2626; }
        .btn-active { ring: 2px solid #f97316; background: #ea580c !important; }
        
        .main-container { display: flex; flex: 1; overflow: hidden; }
        .video-section { flex: 1; display: flex; flex-direction: column; background: #020617; position: relative; border-right: 1px solid #1e293b; }
        
        .stage-container { flex: 1; position: relative; display: flex; justify-content: center; align-items: center; overflow: hidden; background: #000; }
        video { max-width: 100%; max-height: 100%; object-fit: contain; pointer-events: none; }
        canvas { position: absolute; touch-action: none; cursor: crosshair; }
        
        .drop-overlay { position: absolute; inset: 0; background: rgba(15, 23, 42, 0.95); display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 16px; border: 2px dashed #f97316; margin: 20px; border-radius: 12px; z-index: 50; }
        .drop-overlay.hidden { display: none; }
        .drop-title { font-size: 1.3rem; font-weight: 700; color: #f8fafc; }
        .drop-sub { font-size: 0.85rem; color: #94a3b8; text-align: center; line-height: 1.5; }
        
        .controls-panel { background: #1e293b; padding: 10px 14px; display: flex; flex-direction: column; gap: 8px; border-top: 1px solid #334155; }
        .timeline-row { display: flex; align-items: center; gap: 10px; }
        .time-display { font-family: monospace; font-size: 0.9rem; min-width: 105px; color: #f97316; font-weight: 700; }
        input[type="range"] { flex: 1; height: 6px; border-radius: 3px; accent-color: #f97316; cursor: pointer; }
        
        .buttons-row { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
        .button-group { display: flex; gap: 6px; align-items: center; }
        
        .tool-panel { background: #0f172a; padding: 6px 10px; border-radius: 8px; display: flex; gap: 10px; align-items: center; border: 1px solid #334155; }
        .color-picker { display: flex; gap: 6px; }
        .color-dot { width: 20px; height: 20px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: transform 0.1s; }
        .color-dot.selected { border-color: #fff; transform: scale(1.2); }
        
        .side-section { width: 340px; background: #0f172a; display: flex; flex-direction: column; border-left: 1px solid #1e293b; }
        .side-header { padding: 10px 14px; background: #1e293b; border-bottom: 1px solid #334155; font-weight: 700; display: flex; justify-content: space-between; align-items: center; }
        
        .quick-tags { padding: 10px 14px; border-bottom: 1px solid #1e293b; display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
        .tag-btn { padding: 8px; font-weight: 700; text-align: center; border-radius: 6px; cursor: pointer; font-size: 0.8rem; border: none; color: white; transition: opacity 0.2s; user-select: none; }
        .tag-btn:hover { opacity: 0.88; }
        .tag-offense { background: #ef4444; }
        .tag-defense { background: #3b82f6; }
        .tag-3p { background: #10b981; }
        .tag-to { background: #f59e0b; }
        
        .timestamp-list { flex: 1; overflow-y: auto; padding: 10px 14px; display: flex; flex-direction: column; gap: 8px; }
        .timestamp-card { background: #1e293b; border-radius: 8px; padding: 8px 10px; border: 1px solid #334155; display: flex; flex-direction: column; gap: 6px; }
        .ts-header { display: flex; justify-content: space-between; align-items: center; }
        .ts-time { font-family: monospace; font-weight: 700; color: #f97316; cursor: pointer; font-size: 0.95rem; }
        .ts-badge { padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; font-weight: 700; color: #fff; }
        .ts-input { background: #0f172a; border: 1px solid #334155; color: #f8fafc; padding: 5px 8px; border-radius: 4px; font-size: 0.8rem; width: 100%; }
        .ts-actions { display: flex; justify-content: flex-end; gap: 6px; }
        
        .shortcuts-info { padding: 8px 14px; background: #1e293b; border-top: 1px solid #334155; font-size: 0.7rem; color: #94a3b8; line-height: 1.4; }
        
        select { background: #334155; color: white; border: none; padding: 5px 8px; border-radius: 6px; font-size: 0.8rem; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <h1>🏀 バスケ動画分析 Web App (安全強化版)</h1>
        <div class="header-actions">
            <button class="btn btn-primary" onclick="document.getElementById('fileInput').click()">📁 動画を開く</button>
            <input type="file" id="fileInput" accept="video/mp4,video/quicktime,video/webm" style="display:none;" onchange="loadVideo(this.files[0])">
            <button class="btn" onclick="exportData()">💾 JSON保存</button>
            <button class="btn" onclick="document.getElementById('jsonInput').click()">📂 JSON読込</button>
            <input type="file" id="jsonInput" accept=".json" style="display:none;" onchange="importData(this.files[0])">
        </div>
    </header>

    <div class="main-container">
        <div class="video-section">
            <div class="stage-container" id="stageContainer">
                <div class="drop-overlay" id="dropOverlay">
                    <div class="drop-title">MP4 動画ファイルをドラッグ＆ドロップ</div>
                    <div class="drop-sub">または「📁 動画を開く」ボタンからファイルを選択してください<br>（完全ローカル処理 / 外部送信なし）</div>
                    <button class="btn btn-primary" onclick="document.getElementById('fileInput').click()">ファイルを選択</button>
                </div>
                <video id="videoPlayer" playsinline></video>
                <canvas id="drawCanvas"></canvas>
            </div>

            <div class="controls-panel">
                <div class="timeline-row">
                    <span class="time-display" id="timeDisplay">00:00 / 00:00</span>
                    <input type="range" id="seekBar" value="0" step="0.05" oninput="seekVideo(this.value)">
                </div>

                <div class="buttons-row">
                    <div class="button-group">
                        <button class="btn btn-primary" id="playBtn" onclick="togglePlay()">再生 [Space]</button>
                        <button class="btn" onclick="stepFrame(-1)">◀ 1コマ戻る [,]</button>
                        <button class="btn" onclick="stepFrame(1)">1コマ進む ▶ [.]</button>
                        <select id="speedSelect" onchange="changeSpeed(this.value)">
                            <option value="0.25">0.25x</option>
                            <option value="0.5">0.5x</option>
                            <option value="1" selected>1.0x (標準)</option>
                            <option value="1.5">1.5x</option>
                            <option value="2">2.0x</option>
                        </select>
                    </div>

                    <div class="tool-panel">
                        <button class="btn" id="drawModeBtn" onclick="toggleDrawMode()">✏️ 描画: OFF [C]</button>
                        <select id="toolSelect" onchange="changeTool(this.value)">
                            <option value="pen">フリーハンド</option>
                            <option value="arrow">矢印 (パス/動線)</option>
                            <option value="circle">円 (スポット)</option>
                            <option value="rect">四角形</option>
                            <option value="highlighter">マーカー</option>
                        </select>
                        <div class="color-picker">
                            <div class="color-dot selected" style="background:#ef4444;" onclick="selectColor('#ef4444', this)"></div>
                            <div class="color-dot" style="background:#3b82f6;" onclick="selectColor('#3b82f6', this)"></div>
                            <div class="color-dot" style="background:#f59e0b;" onclick="selectColor('#f59e0b', this)"></div>
                            <div class="color-dot" style="background:#ffffff;" onclick="selectColor('#ffffff', this)"></div>
                        </div>
                        <button class="btn" onclick="undoDraw()">↩️ 戻る</button>
                        <button class="btn btn-danger" onclick="clearCanvas()">🗑️ クリア</button>
                        <button class="btn btn-success" onclick="downloadSnapshot()">📸 PNG保存</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="side-section">
            <div class="side-header">
                <span>📌 タイムスタンプ・メモ</span>
                <span id="tsCount" style="color:#94a3b8; font-size:0.8rem;">0 件</span>
            </div>

            <div class="quick-tags">
                <button class="tag-btn tag-offense" onclick="addTimestamp('オフェンス')">赤: オフェンス [O]</button>
                <button class="tag-btn tag-defense" onclick="addTimestamp('ディフェンス')">青: ディフェンス [D]</button>
                <button class="tag-btn tag-3p" onclick="addTimestamp('3Pシュート')">緑: 3Pシュート [3]</button>
                <button class="tag-btn tag-to" onclick="addTimestamp('TO / 課題')">黄: TO / 課題 [T]</button>
            </div>

            <div class="timestamp-list" id="timestampList"></div>

            <div class="shortcuts-info">
                <strong>⌨️ ショートカット</strong><br>
                [Space] 再生/停止 | [,] [.] コマ送り<br>
                [C] 描画切替 | [O] 赤 | [D] 青 | [3] 緑 | [T] 黄
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('videoPlayer');
        const canvas = document.getElementById('drawCanvas');
        const ctx = canvas.getContext('2d');
        const stage = document.getElementById('stageContainer');
        const dropOverlay = document.getElementById('dropOverlay');
        const seekBar = document.getElementById('seekBar');
        const timeDisplay = document.getElementById('timeDisplay');
        const playBtn = document.getElementById('playBtn');
        const drawModeBtn = document.getElementById('drawModeBtn');
        const timestampList = document.getElementById('timestampList');

        let isDrawMode = false;
        let isDrawing = false;
        let startX = 0, startY = 0;
        let currentColor = '#ef4444';
        let currentTool = 'pen';
        let drawHistory = [];
        let timestamps = [];
        let currentVideoUrl = null;

        // リロード誤動作防止
        window.addEventListener('beforeunload', (e) => {
            if (timestamps.length > 0) {
                e.preventDefault();
                e.returnValue = '未保存の分析データがあります。終了しますか？';
            }
        });

        // ドラッグ＆ドロップ対応
        stage.addEventListener('dragover', (e) => { e.preventDefault(); });
        stage.addEventListener('drop', (e) => {
            e.preventDefault();
            if (e.dataTransfer.files.length > 0) {
                loadVideo(e.dataTransfer.files[0]);
            }
        });

        function loadVideo(file) {
            if (!file) return;
            // メモリ解放処理
            if (currentVideoUrl) {
                URL.revokeObjectURL(currentVideoUrl);
            }
            currentVideoUrl = URL.createObjectURL(file);
            video.src = currentVideoUrl;
            dropOverlay.classList.add('hidden');
            video.onloadedmetadata = () => {
                seekBar.max = video.duration;
                updateTimeDisplay();
                resizeCanvas();
            };
        }

        function resizeCanvas() {
            if (!video.videoWidth) return;
            const videoRatio = video.videoWidth / video.videoHeight;
            const stageRatio = stage.clientWidth / stage.clientHeight;
            
            let w, h;
            if (stageRatio > videoRatio) {
                h = stage.clientHeight;
                w = h * videoRatio;
            } else {
                w = stage.clientWidth;
                h = w / videoRatio;
            }

            canvas.width = w;
            canvas.height = h;
            canvas.style.width = w + 'px';
            canvas.style.height = h + 'px';
            canvas.style.left = ((stage.clientWidth - w) / 2) + 'px';
            canvas.style.top = ((stage.clientHeight - h) / 2) + 'px';
        }
        window.addEventListener('resize', resizeCanvas);

        function togglePlay() {
            if (video.paused) {
                if (isDrawMode) toggleDrawMode();
                video.play();
                playBtn.innerText = '停止 [Space]';
            } else {
                video.pause();
                playBtn.innerText = '再生 [Space]';
            }
        }

        video.addEventListener('timeupdate', () => {
            seekBar.value = video.currentTime;
            updateTimeDisplay();
        });

        function seekVideo(val) {
            video.currentTime = val;
            updateTimeDisplay();
        }

        function stepFrame(delta) {
            video.pause();
            playBtn.innerText = '再生 [Space]';
            video.currentTime = Math.max(0, Math.min(video.duration, video.currentTime + (delta * 0.033)));
        }

        function changeSpeed(val) {
            video.playbackRate = parseFloat(val);
        }

        function updateTimeDisplay() {
            const cur = formatTime(video.currentTime);
            const dur = formatTime(video.duration || 0);
            timeDisplay.innerText = `${cur} / ${dur}`;
        }

        function formatTime(sec) {
            const m = Math.floor(sec / 60).toString().padStart(2, '0');
            const s = Math.floor(sec % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function toggleDrawMode() {
            isDrawMode = !isDrawMode;
            if (isDrawMode) {
                video.pause();
                playBtn.innerText = '再生 [Space]';
                drawModeBtn.classList.add('btn-active');
                drawModeBtn.innerText = '✏️ 描画: ON [C]';
                resizeCanvas();
                saveCanvasState();
            } else {
                drawModeBtn.classList.remove('btn-active');
                drawModeBtn.innerText = '✏️ 描画: OFF [C]';
            }
        }

        function changeTool(tool) { currentTool = tool; }
        function selectColor(color, el) {
            currentColor = color;
            document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('selected'));
            el.classList.add('selected');
        }

        function saveCanvasState() {
            drawHistory.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
            if (drawHistory.length > 20) drawHistory.shift();
        }

        function undoDraw() {
            if (drawHistory.length > 0) {
                const state = drawHistory.pop();
                ctx.putImageData(state, 0, 0);
            }
        }

        function clearCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawHistory = [];
        }

        canvas.addEventListener('pointerdown', (e) => {
            if (!isDrawMode) return;
            isDrawing = true;
            canvas.setPointerCapture(e.pointerId);
            saveCanvasState();
            const rect = canvas.getBoundingClientRect();
            startX = e.clientX - rect.left;
            startY = e.clientY - rect.top;

            ctx.strokeStyle = currentColor;
            ctx.fillStyle = currentColor;
            ctx.lineWidth = currentTool === 'highlighter' ? 12 : 3;
            ctx.globalAlpha = currentTool === 'highlighter' ? 0.35 : 1.0;
            ctx.lineCap = 'round';

            if (currentTool === 'pen' || currentTool === 'highlighter') {
                ctx.beginPath();
                ctx.moveTo(startX, startY);
            }
        });

        canvas.addEventListener('pointermove', (e) => {
            if (!isDrawing || !isDrawMode) return;
            const rect = canvas.getBoundingClientRect();
            const curX = e.clientX - rect.left;
            const curY = e.clientY - rect.top;

            if (currentTool === 'pen' || currentTool === 'highlighter') {
                ctx.lineTo(curX, curY);
                ctx.stroke();
            } else {
                if (drawHistory.length > 0) {
                    ctx.putImageData(drawHistory[drawHistory.length - 1], 0, 0);
                } else {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                }

                ctx.beginPath();
                if (currentTool === 'arrow') {
                    drawArrow(startX, startY, curX, curY);
                } else if (currentTool === 'circle') {
                    const radius = Math.hypot(curX - startX, curY - startY);
                    ctx.arc(startX, startY, radius, 0, Math.PI * 2);
                    ctx.stroke();
                } else if (currentTool === 'rect') {
                    ctx.strokeRect(startX, startY, curX - startX, curY - startY);
                }
            }
        });

        canvas.addEventListener('pointerup', (e) => {
            isDrawing = false;
            try { canvas.releasePointerCapture(e.pointerId); } catch(err){}
        });

        function drawArrow(fromX, fromY, toX, toY) {
            const headlen = 10;
            const angle = Math.atan2(toY - fromY, toX - fromX);
            ctx.moveTo(fromX, fromY);
            ctx.lineTo(toX, toY);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(toX, toY);
            ctx.lineTo(toX - headlen * Math.cos(angle - Math.PI / 6), toY - headlen * Math.sin(angle - Math.PI / 6));
            ctx.lineTo(toX - headlen * Math.cos(angle + Math.PI / 6), toY - headlen * Math.sin(angle + Math.PI / 6));
            ctx.closePath();
            ctx.fill();
        }

        function downloadSnapshot() {
            const mergeCanvas = document.createElement('canvas');
            mergeCanvas.width = video.videoWidth || 1280;
            mergeCanvas.height = video.videoHeight || 720;
            const mCtx = mergeCanvas.getContext('2d');

            mCtx.drawImage(video, 0, 0, mergeCanvas.width, mergeCanvas.height);
            mCtx.drawImage(canvas, 0, 0, mergeCanvas.width, mergeCanvas.height);

            const a = document.createElement('a');
            a.download = `basketball_analysis_${formatTime(video.currentTime).replace(':', '-')}.png`;
            a.href = mergeCanvas.toDataURL('image/png');
            a.click();
        }

        function addTimestamp(tag) {
            const time = video.currentTime;
            timestamps.push({ id: Date.now(), time, tag, memo: '' });
            timestamps.sort((a, b) => a.time - b.time);
            renderTimestamps();
        }

        function renderTimestamps() {
            timestampList.innerHTML = '';
            document.getElementById('tsCount').innerText = `${timestamps.length} 件`;

            timestamps.forEach((ts) => {
                const card = document.createElement('div');
                card.className = 'timestamp-card';

                let badgeClass = 'tag-offense';
                if (ts.tag.includes('ディフェンス')) badgeClass = 'tag-defense';
                if (ts.tag.includes('3P')) badgeClass = 'tag-3p';
                if (ts.tag.includes('TO')) badgeClass = 'tag-to';

                card.innerHTML = `
                    <div class="ts-header">
                        <span class="ts-time" onclick="seekVideo(${ts.time})">⏱️ ${formatTime(ts.time)}</span>
                        <span class="ts-badge ${badgeClass}">${ts.tag}</span>
                    </div>
                    <input type="text" class="ts-input" placeholder="メモを入力..." value="${ts.memo}" onchange="updateMemo(${ts.id}, this.value)">
                    <div class="ts-actions">
                        <button class="btn btn-danger" style="padding:2px 6px; font-size:0.75rem;" onclick="deleteTimestamp(${ts.id})">削除</button>
                    </div>
                `;
                timestampList.appendChild(card);
            });
        }

        function updateMemo(id, val) {
            const item = timestamps.find(t => t.id === id);
            if (item) item.memo = val;
        }

        function deleteTimestamp(id) {
            timestamps = timestamps.filter(t => t.id !== id);
            renderTimestamps();
        }

        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(timestamps, null, 2));
            const a = document.createElement('a');
            a.href = dataStr;
            a.download = "basketball_analysis_data.json";
            a.click();
        }

        function importData(file) {
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                timestamps = JSON.parse(e.target.result);
                renderTimestamps();
            };
            reader.readAsText(file);
        }

        window.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT') return;
            if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
            if (e.key === ',') stepFrame(-1);
            if (e.key === '.') stepFrame(1);
            if (e.key === 'c' || e.key === 'C') toggleDrawMode();
            if (e.key === 'o' || e.key === 'O') addTimestamp('オフェンス');
            if (e.key === 'd' || e.key === 'D') addTimestamp('ディフェンス');
            if (e.key === '3') addTimestamp('3Pシュート');
            if (e.key === 't' || e.key === 'T') addTimestamp('TO / 課題');
        });
    </script>
</body>
</html>
